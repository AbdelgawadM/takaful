<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بوابة الشريك | تكافل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body class="portal" data-chrome="none">

<div class="portal-shell">
  <aside class="portal-side on-dark" id="side">
    <a class="brand" href="../index.html" style="flex-direction:column;align-items:flex-start;gap:6px">
      <img class="brand-logo logo-invert" src="../assets/img/logo.png" alt="تكافل العربية" style="height:40px;opacity:.95">
      <span style="font-size:.62rem;font-weight:700;letter-spacing:2.5px;color:#6d81ab">PARTNER PORTAL</span>
    </a>
    <div style="padding:0 12px 10px">
      <div class="card" style="background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1);padding:12px 14px;display:flex;gap:10px;align-items:center">
        <span class="avatar" style="width:38px;height:38px;background:hsl(150,55%,36%)">د</span>
        <span style="min-width:0"><b style="color:#fff;font-size:.85rem;display:block">مختبرات الدقة الطبية</b><span style="font-size:.66rem;color:#8fa2c4">فرع الروضة · موظف تحقق</span></span>
      </div>
    </div>
    <nav id="side-nav" aria-label="أقسام بوابة الشريك"></nav>
    <div style="margin-top:auto;padding:12px"><a href="../index.html" class="portal-link">→ العودة للموقع</a></div>
  </aside>

  <main class="portal-main" id="main">
    <div class="portal-topbar">
      <button class="icon-btn portal-menu-btn" id="side-toggle" aria-label="القائمة"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <h1 id="page-title">التحقق</h1>
      <span class="badge badge-neutral">بيانات تجريبية — نموذج واجهة</span>
      <span class="spacer"></span>
      <span class="badge badge-success">مؤشر الجودة: 89/100</span>
    </div>
    <div id="content"></div>
  </main>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const { icon, sar, qrSvg } = TK;

  const SECTIONS = [
    { id: "verify", label: "التحقق", icon: "qr" },
    { id: "branches", label: "الفروع وساعات العمل", icon: "pin" },
    { id: "services", label: "خدماتي المباعة", icon: "cart" },
    { id: "vouchers", label: "القسائم", icon: "doc" },
    { id: "settlements", label: "التسويات", icon: "wallet" },
    { id: "reels", label: "رفع Reels", icon: "reels" },
    { id: "offers", label: "العروض", icon: "tag" },
    { id: "complaints", label: "الشكاوى", icon: "flag", badge: "2" }
  ];
  TK.$("#side-nav").innerHTML = SECTIONS.map(s => `
    <button class="portal-link ${s.id === "verify" ? "active" : ""}" data-sec="${s.id}">
      ${icon(s.icon, 18)} ${s.label} ${s.badge ? `<span class="badge badge-error">${s.badge}</span>` : ""}
    </button>`).join("");

  const table = (heads, rows) => `
    <div class="table-wrap"><table class="data-table">
      <thead><tr>${heads.map(h => `<th>${h}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody>
    </table></div>`;

  const V = {
    verify: () => `
      <div class="grid" style="grid-template-columns:1fr 1fr;align-items:start">
        <div class="card info-card">
          <h3 class="t-h3">تحقق من عضو أو قسيمة</h3>
          <p class="t-caption">امسح رمز QR من جوال العميل، أو أدخل الرقم يدويًا.</p>
          <div style="display:grid;place-items:center;padding:22px;background:var(--c-surface-2);border-radius:var(--r-lg);border:2px dashed var(--c-border-strong)">
            <svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="var(--c-primary-600)" stroke-width="1.2" stroke-linecap="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><path d="M13.5 13.5h3v3h-3zM17.5 17.5h3v3h-3z"/></svg>
            <button class="btn btn-primary" style="margin-top:14px" id="scan-btn">فتح الكاميرا للمسح</button>
          </div>
          <div class="field"><label for="manual-code">أو أدخل الرقم يدويًا</label>
            <div style="display:flex;gap:8px">
              <input class="input" id="manual-code" placeholder="TKF-… أو TKV-…" dir="ltr" style="text-align:left">
              <button class="btn btn-secondary" id="check-btn">تحقق</button>
            </div>
          </div>
        </div>
        <div id="verify-result">
          <div class="state-block info">
            <div class="st-icon">${icon("qr", 30)}</div>
            <h3>بانتظار التحقق</h3>
            <p>ستظهر هنا نتيجة التحقق: صلاحية العضوية أو حالة القسيمة، مع الإجراء المسموح.</p>
          </div>
        </div>
      </div>`,

    branches: () => table(
      ["الفرع", "المدينة", "ساعات العمل", "السحب المنزلي", "الحالة"],
      [["فرع الروضة", "الرياض", "24 ساعة", "متاح", ""], ["فرع السويدي", "الرياض", "8 ص – 12 م", "متاح", ""], ["فرع الشفا", "الرياض", "8 ص – 11 م", "غير متاح", ""]]
        .map(r => { r[0] = `<span class="cell-main">${r[0]}</span>`; r[4] = '<span class="badge badge-success">نشط</span>'; return r; })) +
      `<p class="t-caption" style="margin-top:10px">تعديل ساعات العمل ضمن صلاحيات محدودة — التغييرات الكبرى تتطلب موافقة إدارة تكافل.</p>`,

    services: () => table(
      ["الخدمة", "السعر النهائي", "المباع (30ي)", "المستخدم", "التحويل من Reels"],
      TK.services.filter(s => s.providerId === "p3").map(s => [`<span class="cell-main">${s.title}</span>`, `<b>${sar(s.price)} ر.س</b>`, "214", "196", "18%"])),

    vouchers: () => table(
      ["القسيمة", "الخدمة", "المستفيد", "الفرع", "الحالة"],
      [["TKV-88412-QR", "الفحص الشامل المتقدم", "عبدالله ح.", "الروضة", '<span class="badge badge-success">جاهزة</span>'],
       ["TKV-88340-QR", "فحص الفيتامينات", "سارة د.", "السويدي", '<span class="badge badge-neutral">مستخدمة</span>'],
       ["TKV-88322-QR", "فحص ما قبل الزواج", "محمد ز.", "الروضة", '<span class="badge badge-neutral">مستخدمة</span>'],
       ["TKV-88267-QR", "الفحص الشامل المتقدم", "نوف ع.", "الشفا", '<span class="badge badge-warning">منتهية</span>']
      ].map(r => { r[0] = `<span class="cell-main" style="direction:ltr;display:inline-block">${r[0]}</span>`; return r; })),

    settlements: () => `
      <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr)">
        <div class="card kpi-card"><span class="k-label">مستحقك الحالي</span><span class="k-value">${sar(48210)} ر.س</span><span class="k-delta up">▲ دورة 16–31 يوليو</span></div>
        <div class="card kpi-card"><span class="k-label">قيد المراجعة</span><span class="k-value">${sar(12140)} ر.س</span><span class="k-delta up">دورة 1–15 أغسطس</span></div>
        <div class="card kpi-card"><span class="k-label">محجوز لنزاع</span><span class="k-value">0 ر.س</span><span class="k-delta up">لا نزاعات مفتوحة</span></div>
      </div>
      <div style="margin-top:16px">${table(["الدورة", "العمليات", "الإجمالي", "العمولة", "الصافي", "الحالة"],
      [["16–31 يوليو", "412", sar(56720), sar(8510), sar(48210), '<span class="badge badge-success">مدفوعة</span>'],
       ["1–15 يوليو", "388", sar(51230), sar(7680), sar(43550), '<span class="badge badge-success">مدفوعة</span>'],
       ["16–30 يونيو", "341", sar(44980), sar(6740), sar(38240), '<span class="badge badge-success">مدفوعة</span>']
      ].map(r => { for (let i = 2; i <= 4; i++) r[i] = `<b>${r[i]} ر.س</b>`; return r; }))}
      <button class="btn btn-primary" style="margin-top:14px" data-mock="رفع طلب تسوية للدورة الحالية (نموذج عرض)">رفع طلب تسوية</button>`,

    reels: () => `
      <div class="grid" style="grid-template-columns:1fr 1fr;align-items:start">
        <div class="card info-card">
          <h3 class="t-h3">رفع مقطع جديد</h3>
          <div style="display:grid;place-items:center;padding:28px;background:var(--c-surface-2);border-radius:var(--r-lg);border:2px dashed var(--c-border-strong);text-align:center">
            ${icon("reels", 40)}
            <p class="t-caption" style="margin-top:10px">فيديو عمودي 9:16 · حتى 90 ثانية · MP4</p>
            <button class="btn btn-secondary btn-sm" style="margin-top:10px" data-mock="اختيار ملف فيديو (نموذج عرض)" data-mock-kind="info">اختر ملفًا</button>
          </div>
          <div class="alert alert-warning">${icon("info", 18)}<span>يخضع كل مقطع لمراجعة سياسة المحتوى الطبي: لا وعود علاجية، إظهار اسم الممارس وترخيصه عند النصيحة، ووسم «إعلان» للمحتوى المدفوع.</span></div>
        </div>
        <div>${table(["المقطع", "الحالة", "مشاهدات", "تحويل"],
          [["متى تحتاج فعلًا لفحص فيتامين د؟", '<span class="badge badge-success">منشور</span>', "121K", "18%"],
           ["قراءة تحليل الدم الشامل", '<span class="badge badge-info">قيد المراجعة</span>', "—", "—"],
           ["أخطاء شائعة قبل التحاليل", '<span class="badge badge-error">مرفوض — وعد علاجي</span>', "—", "—"]
          ].map(r => { r[0] = `<span class="cell-main">${r[0]}</span>`; return r; }))}</div>
      </div>`,

    offers: () => table(
      ["العرض", "القيمة", "المدة", "الحالة"],
      [["السحب المنزلي مجانًا فوق 150 ر.س", "0 ر.س", "حتى 15 سبتمبر", '<span class="badge badge-success">منشور</span>'],
       ["خصم إضافي على باقات الشركات", "10%", "بانتظار الاعتماد", '<span class="badge badge-info">قيد المراجعة</span>']
      ].map(r => { r[0] = `<span class="cell-main">${r[0]}</span>`; return r; })) +
      `<button class="btn btn-primary" style="margin-top:14px" data-mock="إنشاء عرض جديد يخضع لمراجعة السعر والشروط" data-mock-kind="info">+ عرض جديد</button>`,

    complaints: () => table(
      ["البلاغ", "النوع", "الفرع", "العمر", "SLA المتبقي", "الحالة"],
      [["#4126", "نزاع قسيمة", "الروضة", "يوم", "48 س", '<span class="badge badge-warning">بانتظار ردك</span>'],
       ["#4119", "تأخر نتيجة", "السويدي", "يومان", "24 س", '<span class="badge badge-warning">بانتظار ردك</span>'],
       ["#4104", "خطأ سعر", "الروضة", "6 أيام", "—", '<span class="badge badge-success">محلول</span>']
      ].map(r => { r[0] = `<span class="cell-main" style="direction:ltr;display:inline-block">${r[0]}</span>`; return r; })) +
      `<div class="alert alert-info" style="margin-top:14px">${icon("info", 18)}<span>تجاوز SLA يؤثر على مؤشر جودة الشريك وقد يعلق ظهور الفرع تلقائيًا عند التكرار.</span></div>`
  };

  const TITLES = Object.fromEntries(SECTIONS.map(s => [s.id, s.label]));
  function show(id) {
    TK.$("#page-title").textContent = TITLES[id];
    TK.$("#content").innerHTML = `<div class="pane active">${V[id]()}</div>`;
    TK.$$(".portal-link[data-sec]").forEach(l => l.classList.toggle("active", l.dataset.sec === id));
    TK.$("#side").classList.remove("open");
    bindVerify();
  }

  function bindVerify() {
    const scan = TK.$("#scan-btn"), check = TK.$("#check-btn");
    if (!scan) return;
    const showResult = ok => {
      TK.$("#verify-result").innerHTML = ok ? `
        <div class="card info-card" style="border-color:var(--c-success);border-width:1.5px">
          <div style="display:flex;gap:12px;align-items:center">
            <span style="width:52px;height:52px;border-radius:16px;background:var(--c-success-bg);color:var(--c-success);display:grid;place-items:center">${icon("check", 26)}</span>
            <div><b style="color:var(--c-ink);font-size:1.05rem">قسيمة صالحة — جاهزة للاستخدام</b><p class="t-caption">TKV-88412-QR · الفحص الشامل المتقدم</p></div>
          </div>
          <div class="voucher-meta">
            <div class="vm"><b>عبدالله محمد الحربي</b><span>المستفيد</span></div>
            <div class="vm"><b>فرع الروضة</b><span>الفرع الصحيح ✓</span></div>
            <div class="vm"><b>2026-11-04</b><span>صالحة حتى</span></div>
            <div class="vm"><b>${sar(199)} ر.س</b><span>مدفوعة بالكامل</span></div>
          </div>
          <button class="btn btn-primary btn-block" id="confirm-use">تأكيد الاستخدام الآن</button>
          <p class="t-caption" style="text-align:center">التأكيد نهائي — يمنع النظام إعادة الاستخدام حتى مع تزامن الطلبات.</p>
        </div>` : `
        <div class="card info-card" style="border-color:var(--c-error);border-width:1.5px">
          <div style="display:flex;gap:12px;align-items:center">
            <span style="width:52px;height:52px;border-radius:16px;background:var(--c-error-bg);color:var(--c-error);display:grid;place-items:center">${icon("x", 26)}</span>
            <div><b style="color:var(--c-ink);font-size:1.05rem">رمز غير صالح</b><p class="t-caption">تحقق من الرقم أو اطلب من العميل تحديث الشاشة (QR ديناميكي).</p></div>
          </div>
        </div>`;
      const cu = TK.$("#confirm-use");
      if (cu) cu.onclick = () => {
        cu.outerHTML = `<div class="alert alert-success">${icon("check", 18)}<span><b>تم تأكيد الاستخدام 10:42 ص.</b> انتقلت القسيمة إلى «مستخدمة» وستدخل دورة التسوية القادمة.</span></div>`;
        TK.toast("تم تأكيد استخدام القسيمة");
      };
    };
    scan.onclick = () => { TK.toast("محاكاة مسح ناجح (نموذج عرض)", "info"); showResult(true); };
    check.onclick = () => {
      const v = TK.$("#manual-code").value.trim();
      showResult(v.toUpperCase().startsWith("TK"));
    };
  }

  TK.$("#side-nav").addEventListener("click", e => {
    const l = e.target.closest("[data-sec]"); if (l) show(l.dataset.sec);
  });
  TK.$("#side-toggle").onclick = () => TK.$("#side").classList.toggle("open");
  show("verify");
});
</script>
</body>
</html>
