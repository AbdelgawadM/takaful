<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اشترِ خدمة — أسعار نهائية | تكافل</title>
<meta name="description" content="خدمات طبية بسعر نهائي معلن: تحاليل، أسنان، ليزر، نظر، ولادة — ادفع الآن واستخدمها لدى المركز.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
<a class="skip-link" href="#main">تخطَّ إلى المحتوى</a>

<main id="main">
  <section class="page-hero">
    <div class="container">
      <nav class="breadcrumb" aria-label="مسار التنقل">
        <a href="index.html">الرئيسية</a><span class="sep">/</span><span aria-current="page">اشترِ خدمة</span>
      </nav>
      <div class="section-head" style="margin-block:16px 0">
        <div>
          <span class="kicker">ادفع الآن واستخدمها لدى المركز</span>
          <h1 class="t-h1">خدمات بسعر نهائي، بلا مفاجآت</h1>
          <p class="t-caption" style="margin-top:8px">متاحة للمشترك وغير المشترك — يكفي تسجيل الدخول قبل الدفع · <span id="svc-count"></span></p>
        </div>
        <div class="segmented" role="tablist" aria-label="الترتيب">
          <button role="tab" aria-selected="true" data-sort="save">الأكثر توفيرًا</button>
          <button role="tab" aria-selected="false" data-sort="price">الأقل سعرًا</button>
        </div>
      </div>
    </div>
  </section>

  <section class="container" aria-label="الخدمات">
    <div class="toolbar">
      <div class="filters-scroll" id="cat-chips" role="tablist" aria-label="الأقسام"></div>
    </div>
    <div class="grid grid-4" id="services-grid" aria-live="polite" style="margin-top:8px"></div>
    <div id="empty-slot" style="margin-top:20px"></div>

    <div class="alert alert-info reveal" style="margin-top:40px;max-width:760px">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5"/><circle cx="12" cy="8" r=".9" fill="currentColor"/></svg>
      <span>السعر السابق يُعرض فقط عندما يكون مثبتًا لدى المركز. الأسعار النهائية تشمل الضريبة، وسياسة الإلغاء معلنة داخل كل خدمة قبل الدفع.</span>
    </div>
  </section>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const grid = TK.$("#services-grid");
  const params = new URLSearchParams(location.search);
  const state = { cat: params.get("cat"), sort: "save" };

  TK.$("#cat-chips").innerHTML = `<button class="chip ${!state.cat ? "active" : ""}" data-cat="">الكل</button>` +
    TK.categories.filter(c => TK.services.some(s => s.cat === c.id))
      .map(c => `<button class="chip ${state.cat === c.id ? "active" : ""}" data-cat="${c.id}">${c.label}</button>`).join("");

  function render(withSkeleton = true) {
    let items = TK.services.filter(s => !state.cat || s.cat === state.cat);
    items.sort((a, b) => state.sort === "price" ? a.price - b.price : (b.was - b.price) - (a.was - a.price));
    const doRender = () => {
      TK.$("#svc-count").textContent = `${items.length} خدمة متاحة`;
      if (!items.length) {
        grid.innerHTML = "";
        TK.$("#empty-slot").innerHTML = `
          <div class="state-block">
            <div class="st-icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/><path d="M3 4h2.5l2.2 11.5a1.5 1.5 0 0 0 1.5 1.2h7.8a1.5 1.5 0 0 0 1.5-1.2L20.5 8H6"/></svg></div>
            <h3>لا توجد خدمات في هذا القسم بعد</h3>
            <p>نضيف خدمات جديدة أسبوعيًا مع شركائنا. تصفح قسمًا آخر أو استكشف المراكز مباشرة.</p>
            <div class="st-actions">
              <button class="btn btn-primary" id="show-all">عرض كل الخدمات</button>
              <a class="btn btn-secondary" href="providers.html">تصفح المراكز</a>
            </div>
          </div>`;
        TK.$("#show-all").onclick = () => { state.cat = null; syncChips(); render(); };
      } else {
        TK.$("#empty-slot").innerHTML = "";
        grid.innerHTML = items.map(TK.serviceCard).join("");
        grid.setAttribute("data-stagger", "");
      }
      TK.initReveal();
    };
    if (withSkeleton) TK.withSkeleton(grid, TK.skelCards(8), doRender, 700); else doRender();
  }

  function syncChips() {
    TK.$$("#cat-chips .chip").forEach(c => c.classList.toggle("active", (c.dataset.cat || null) === state.cat));
  }

  TK.$("#cat-chips").addEventListener("click", e => {
    const chip = e.target.closest(".chip"); if (!chip) return;
    state.cat = chip.dataset.cat || null;
    syncChips(); render();
    history.replaceState(null, "", state.cat ? `?cat=${state.cat}` : "services.html");
  });

  TK.$$("[data-sort]").forEach(b => b.addEventListener("click", () => {
    TK.$$("[data-sort]").forEach(x => x.setAttribute("aria-selected", x === b));
    state.sort = b.dataset.sort; render();
  }));

  render();
});
</script>
</body>
</html>
