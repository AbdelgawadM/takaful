<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تواصل معنا — الدعم | تكافل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
<a class="skip-link" href="#main">تخطَّ إلى المحتوى</a>

<main id="main">
  <div class="container" style="padding-block:32px 48px">
    <nav class="breadcrumb" aria-label="مسار التنقل">
      <a href="index.html">الرئيسية</a><span class="sep">/</span><span aria-current="page">الدعم</span>
    </nav>
    <h1 class="t-h1" style="margin-block:16px 8px">تواصل معنا</h1>
    <p class="t-caption" style="margin-bottom:32px">كل شاشة خطأ عندنا تنتهي بإجراء — وهذه هي إجراءاتك المباشرة.</p>

    <div class="contact-grid">
      <div style="display:grid;gap:12px">
        <a class="card card-hover contact-channel" href="#" data-mock="فتح محادثة واتساب +966 50 010 7020 (نموذج عرض)" data-mock-kind="info">
          <span class="cc-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 4h4l1.5 4.5L8 10a12 12 0 0 0 6 6l1.5-2.5L20 15v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></span>
          <span style="flex:1"><b style="color:var(--c-ink)">واتساب</b><br><span class="t-caption" style="direction:ltr;display:inline-block">+966 50 010 7020</span></span>
          <span class="badge badge-success">الأسرع</span>
        </a>
        <a class="card card-hover contact-channel" href="#" data-mock="فتح محادثة الدعم داخل التطبيق (نموذج عرض)" data-mock-kind="info">
          <span class="cc-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5Z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/></svg></span>
          <span style="flex:1"><b style="color:var(--c-ink)">محادثة مباشرة</b><br><span class="t-caption">يوميًا 8 ص – 12 م</span></span>
        </a>
        <a class="card card-hover contact-channel" href="#" data-mock="فتح بلاغ رفض خصم — يرتبط بالمركز والفرع والوقت" data-mock-kind="info">
          <span class="cc-icon" style="background:var(--c-warning-bg);color:var(--c-warning)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 21V4"/><path d="M5 5h13l-2.5 4L18 13H5"/></svg></span>
          <span style="flex:1"><b style="color:var(--c-ink)">بلاغ رفض خصم</b><br><span class="t-caption">متابعة الحل خلال 48 ساعة</span></span>
        </a>
        <a class="card card-hover contact-channel" href="#" data-mock="نزاع عملية شراء — إيقاف التسوية مؤقتًا حتى الحل" data-mock-kind="info">
          <span class="cc-icon" style="background:var(--c-error-bg);color:var(--c-error)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v5"/><circle cx="12" cy="16.5" r=".9" fill="currentColor"/></svg></span>
          <span style="flex:1"><b style="color:var(--c-ink)">نزاع على عملية</b><br><span class="t-caption">من «مشترياتي ← القسيمة ← فتح نزاع»</span></span>
        </a>
      </div>

      <div class="card info-card">
        <h2 class="t-h3">أرسل تذكرة دعم</h2>
        <form id="ticket-form" style="display:grid;gap:16px" novalidate>
          <div class="field"><label for="t-name">الاسم</label><input class="input" id="t-name" required placeholder="اسمك الكامل"></div>
          <div class="field"><label for="t-phone">رقم الجوال</label>
            <div class="phone-input"><span class="cc">+966</span><input id="t-phone" type="tel" maxlength="9" inputmode="numeric" placeholder="5X XXX XXXX"></div>
          </div>
          <div class="field"><label for="t-topic">الموضوع</label>
            <select class="input" id="t-topic">
              <option>استفسار عام</option><option>مشكلة في قسيمة</option><option>رفض خصم في مركز</option><option>استرداد مبلغ</option><option>مشكلة تقنية</option><option>انضمام كشريك</option>
            </select>
          </div>
          <div class="field"><label for="t-msg">الرسالة</label><textarea class="input" id="t-msg" rows="4" placeholder="اشرح المشكلة باختصار — وإن كانت عن مركز، اذكر الفرع والوقت"></textarea></div>
          <button class="btn btn-primary btn-lg" type="submit">إرسال التذكرة</button>
          <p class="t-caption" id="ticket-note" hidden></p>
        </form>
      </div>
    </div>
  </div>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  TK.$("#ticket-form").addEventListener("submit", e => {
    e.preventDefault();
    const name = TK.$("#t-name"), msg = TK.$("#t-msg");
    let ok = true;
    [name, msg].forEach(f => { const bad = !f.value.trim(); f.classList.toggle("error", bad); if (bad) ok = false; });
    if (!ok) { TK.toast("أكمل الحقول المطلوبة", "info"); return; }
    e.target.reset();
    const n = TK.$("#ticket-note");
    n.hidden = false;
    n.innerHTML = `✅ استلمنا تذكرتك برقم <b>#TK-4127</b> — سنرد خلال ساعات العمل (نموذج عرض).`;
    TK.toast("أُرسلت التذكرة بنجاح");
  });
});
</script>
</body>
</html>
