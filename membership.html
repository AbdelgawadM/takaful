<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بطاقتي | تكافل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
<a class="skip-link" href="#main">تخطَّ إلى المحتوى</a>

<main id="main">
  <div class="container" style="padding-block:28px 40px">
    <div class="section-head">
      <div>
        <span class="kicker">العضوية</span>
        <h1 class="t-h1">بطاقتي</h1>
        <p class="t-caption" style="margin-top:8px">أظهر بطاقتك عند الدفع — يتحقق المركز ويطبق الخصم مباشرة.</p>
      </div>
      <div class="segmented" role="tablist" aria-label="حالة العرض التجريبي">
        <button role="tab" aria-selected="true" data-demo="active">عضوية فعالة</button>
        <button role="tab" aria-selected="false" data-demo="expired">عضوية منتهية</button>
      </div>
    </div>

    <div class="mem-layout" style="margin-top:24px">
      <div class="mem-side">
        <div id="card-slot" style="width:100%;display:grid;justify-items:center;perspective:1200px"></div>
        <p class="t-caption" id="qr-note" style="display:flex;align-items:center;gap:6px">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
          رمز QR ديناميكي — يتجدد كل 60 ثانية للحماية من إساءة الاستخدام
        </p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
          <button class="btn btn-primary" data-mock="أُضيفت البطاقة إلى المحفظة (نموذج عرض)">أضِف إلى Apple Wallet</button>
          <button class="btn btn-secondary" data-mock="تم تنزيل نسخة PDF من البطاقة (نموذج عرض)" data-mock-kind="info">تنزيل PDF</button>
        </div>
      </div>

      <div style="display:grid;gap:var(--sp-5)" id="mem-main"></div>
    </div>
  </div>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const { icon, sar, qrSvg } = TK;
  let mode = "active";
  let activeBen = "self";
  let qrTick = 47;

  function cardHTML() {
    const expired = mode === "expired";
    const bens = [{ id: "self", name: TK.user.name, memberId: TK.user.memberId }, ...TK.user.dependents];
    const b = bens.find(x => x.id === activeBen) || bens[0];
    return `
    <div class="tk-card ${expired ? "" : ""}" role="img" aria-label="بطاقة تكافل — ${b.name}" style="${expired ? "filter:saturate(.55)" : ""}">
      <svg class="tkc-pattern" viewBox="0 0 430 265" preserveAspectRatio="xMidYMid slice"><defs><pattern id="hex2" width="36" height="32" patternUnits="userSpaceOnUse"><path d="M18 2 33 10v16L18 34 3 26V10Z" fill="none" stroke="rgba(255,255,255,.5)" stroke-width=".6"/></pattern></defs><rect width="430" height="265" fill="url(#hex2)"/></svg>
      <div class="tk-card-inner">
        <div class="tkc-top">
          <img class="logo-invert" src="assets/img/logo.png" alt="تكافل العربية" style="height:30px;opacity:.96">
          <span class="tkc-status ${expired ? "expired" : ""}">${expired ? "منتهية — جدد الآن" : "عضوية فعالة"}</span>
        </div>
        <div class="tkc-mid">
          <div class="tkc-holder">
            <div class="t-label">حامل البطاقة</div>
            <div class="name">${b.name}</div>
            <div class="tkc-number">${b.memberId}</div>
          </div>
          <span class="tkc-qr" style="${expired ? "opacity:.4;filter:grayscale(1)" : ""}">${qrSvg(b.memberId + qrTick, 74)}</span>
        </div>
        <div class="tkc-foot"><span>${TK.user.plan}</span><span>${expired ? "انتهت 07 / 2026" : "تنتهي 01 / 2027"}</span></div>
      </div>
    </div>`;
  }

  function mainHTML() {
    const expired = mode === "expired";
    return `
    ${expired ? `
      <div class="alert alert-warning reveal in">
        ${icon("info", 19)}
        <span><b>انتهت عضويتك في 14 يوليو 2026.</b> جدد الآن لاستعادة الخصم الفوري لدى 120+ مركزًا — ويظل «اشترِ خدمة» متاحًا لك دائمًا دون عضوية.</span>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-primary btn-lg" data-mock="بدء تدفق التجديد (نموذج عرض)">جدّد العضوية — 299 ر.س/سنة</button>
        <a class="btn btn-secondary btn-lg" href="services.html">اشترِ خدمة بدون عضوية</a>
      </div>` : `
      <div class="card savings-hero reveal in">
        <p class="t-caption" style="display:flex;align-items:center;justify-content:center;gap:6px">${icon("verified", 15)} التوفير الموثق — من عمليات تحقق منها المركز فقط</p>
        <div class="amount">${sar(TK.user.verifiedSavings)} <small>ر.س</small></div>
        <p class="t-caption">عبر ${TK.user.savingsCount} عملية استخدام مثبتة منذ بداية العضوية</p>
      </div>`}

    <div class="card info-card">
      <h2 class="t-h3">تفاصيل العضوية</h2>
      <div class="mem-detail-list">
        <div class="info-row"><span>الحالة</span><b><span class="badge ${expired ? "badge-warning" : "badge-success"}">${expired ? "منتهية" : "فعالة"}</span></b></div>
        <div class="info-row"><span>الباقة</span><b>${TK.user.plan}</b></div>
        <div class="info-row"><span>رقم العضوية</span><b style="direction:ltr">${TK.user.memberId}</b></div>
        <div class="info-row"><span>تاريخ البداية</span><b>15 يناير 2026</b></div>
        <div class="info-row"><span>تاريخ الانتهاء</span><b>${expired ? "14 يوليو 2026" : "14 يناير 2027"}</b></div>
        <div class="info-row"><span>رمز الشركة</span>
          <button class="section-link" style="font-size:var(--fs-caption)" data-mock="إدخال رمز شركة/جهة لإضافة مزايا العمل" data-mock-kind="info">+ أضف رمز شركة</button></div>
      </div>
    </div>

    <div class="card info-card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h2 class="t-h3">التابعون (${TK.user.dependents.length})</h2>
        <button class="btn btn-ghost btn-sm" data-mock="إضافة تابع جديد (نموذج عرض)" data-mock-kind="info">+ إضافة</button>
      </div>
      <p class="t-caption" style="margin-top:-6px">اختر تابعًا لعرض بطاقته</p>
      <div style="display:grid;gap:8px" id="dep-list">
        ${[{ id: "self", name: TK.user.name, relation: "أنا", memberId: TK.user.memberId, initial: "ع" }, ...TK.user.dependents].map((d, i) => `
          <button class="card dependent-row card-hover ${d.id === activeBen ? "selected" : ""}" data-dep="${d.id}" style="${d.id === activeBen ? "border-color:var(--c-primary-500);background:var(--c-primary-50)" : ""}">
            <span class="avatar" style="background:hsl(${170 + i * 40},45%,40%)">${d.initial}</span>
            <span style="flex:1;text-align:start"><b style="color:var(--c-ink);display:block">${d.name}</b><span class="t-caption">${d.relation} · ${d.memberId}</span></span>
            ${d.id === activeBen ? `<span style="color:var(--c-primary-600)">${icon("check", 20)}</span>` : ""}
          </button>`).join("")}
      </div>
    </div>

    ${!expired ? `
    <div class="card info-card" style="background:var(--c-primary-50);border-color:var(--c-primary-200)">
      <div class="info-row">${icon("bell", 19)}
        <span><b style="color:var(--c-ink)">تنبيهات القرب مفعلة</b><br><span class="t-caption">سننبهك عند اقترابك من مركز شريك — بحد أقصى إشعار واحد يوميًا. <a href="account.html" style="color:var(--c-primary-700);font-weight:600">إدارة التنبيهات</a></span></span>
      </div>
    </div>` : ""}`;
  }

  function render() {
    TK.$("#card-slot").innerHTML = cardHTML();
    TK.$("#mem-main").innerHTML = mainHTML();
    TK.$("#qr-note").style.visibility = mode === "expired" ? "hidden" : "visible";
    TK.$("#dep-list").addEventListener("click", e => {
      const d = e.target.closest("[data-dep]"); if (!d) return;
      activeBen = d.dataset.dep; render();
      TK.toast("تم التبديل إلى بطاقة " + (d.querySelector("b").textContent.split(" ")[0]));
    });
  }

  TK.$$("[data-demo]").forEach(b => b.addEventListener("click", () => {
    TK.$$("[data-demo]").forEach(x => x.setAttribute("aria-selected", x === b));
    mode = b.dataset.demo; activeBen = "self"; render();
  }));

  /* Dynamic QR refresh simulation */
  setInterval(() => {
    if (mode !== "active") return;
    qrTick++;
    const qrEl = TK.$(".tkc-qr");
    if (qrEl) { qrEl.style.opacity = "0"; setTimeout(() => { qrEl.innerHTML = qrSvg(TK.user.memberId + qrTick, 74); qrEl.style.transition = "opacity .4s"; qrEl.style.opacity = "1"; }, 200); }
  }, 8000);

  render();
});
</script>
</body>
</html>
